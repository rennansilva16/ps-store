<div class="home__container">
  @if (isLoading) {
    <p>Carregando jogos...</p>
  } @else if(errorMessage) {
    <p>Erro ao carregar jogos: {{ errorMessage }}</p>
  }
  @else {
    @for(game of games; track game.id){
      <app-card [gameCover]="game.background_image ?? ''" [gameLabel]="game.name" [gameType]="''" [gamePrice]="''">
      </app-card>
    }
  }
</div>
